<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Synapta icon mark</title>
  <desc>Synapta standalone icon: neural synapse with medical cross</desc>

  <!-- Rounded square background -->
  <rect width="256" height="256" rx="52" fill="#0F6E56"/>

  <!-- Outer subtle ring -->
  <circle cx="128" cy="128" r="88" fill="white" opacity="0.06"/>

  <!-- Spoke lines -->
  <line x1="128" y1="102" x2="128" y2="54"  stroke="white" stroke-width="4.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="153" y1="115" x2="196" y2="91"  stroke="white" stroke-width="4.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="153" y1="141" x2="196" y2="165" stroke="white" stroke-width="4.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="128" y1="154" x2="128" y2="202" stroke="white" stroke-width="4.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="103" y1="141" x2="60"  y2="165" stroke="white" stroke-width="4.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="103" y1="115" x2="60"  y2="91"  stroke="white" stroke-width="4.5" stroke-linecap="round" opacity="0.5"/>

  <!-- Center node -->
  <circle cx="128" cy="128" r="32" fill="white" opacity="0.2"/>
  <circle cx="128" cy="128" r="22" fill="white"/>

  <!-- Medical cross (teal) -->
  <rect x="121" y="112" width="14" height="32" rx="3" fill="#0F6E56"/>
  <rect x="112" y="121" width="32" height="14" rx="3" fill="#0F6E56"/>

  <!-- Satellite nodes -->
  <circle cx="128" cy="48"  r="14" fill="white"/><circle cx="128" cy="48"  r="7" fill="#5DCAA5"/>
  <circle cx="201" cy="88"  r="14" fill="#AFA9EC" opacity="0.9"/><circle cx="201" cy="88"  r="7" fill="#534AB7"/>
  <circle cx="201" cy="168" r="14" fill="white"/><circle cx="201" cy="168" r="7" fill="#5DCAA5"/>
  <circle cx="128" cy="208" r="14" fill="#AFA9EC" opacity="0.9"/><circle cx="128" cy="208" r="7" fill="#534AB7"/>
  <circle cx="55"  cy="168" r="14" fill="white"/><circle cx="55"  cy="168" r="7" fill="#5DCAA5"/>
  <circle cx="55"  cy="88"  r="14" fill="#AFA9EC" opacity="0.9"/><circle cx="55"  cy="88"  r="7" fill="#534AB7"/>
</svg>
